OQxs0bc4g3pnI","name":"omp-linux-x64","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":200406496,"digest":"sha256:747518a41fbb32ac47491b4677a7a921d0d9e5977ae006c358d6836813149adc","download_count":2600,"created_at":"2026-09-08T22:39:52Z","updated_at":"2026-09-08T22:40:03Z"},{"id":551459263,"node_id":"RA_kwDOQxs0bc4g3pm_","name":"omp-windows-arm64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":149995520,"digest":"sha256:875c54c5faa9a80f277eebccc2d123670a0bf2f3a246bd2253f99ad7e523ca62","download_count":7,"created_at":"2026-09-08T22:39:52Z","updated_at":"2026-09-08T22:40:00Z"},{"id":551459268,"node_id":"RA_kwDOQxs0bc4g3pnE","name":"omp-windows-x64.exe","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-msdos-program","state":"uploaded","size":160843776,"digest":"sha256:3c6856f4fe2aa77007a60a48dabdf66aaa4c5b5e108223d2cbf6807608401b8e","download_count":1278,"created_at":"2026-09-08T22:39:52Z","updated_at":"2026-09-08T22:40:01Z"},{"id":551459265,"node_id":"RA_kwDOQxs0bc4g3pnB","name":"SHA256SUMS.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":934,"digest":"sha256:41f5b7770b519ab49782b5dd38cd755014e5e92db9db4a264b89bf0865191f53","download_count":98,"created_at":"2026-09-08T22:39:52Z","updated_at":"2026-09-08T22:39:52Z"},{"id":551459269,"node_id":"RA_kwDOQxs0bc4g3pnF","name":"THIRD-PARTY-NOTICES.txt","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"text/plain","state":"uploaded","size":1077086,"digest":"sha256:104142244b8781b7828e64aa79a61b03fdf16e8a3464278647c3d84ad22cbce0","download_count":7,"created_at":"2026-09-08T22:39:52Z","updated_at":"2026-09-08T22:39:52Z"}],"body":"## @oh-my-pi/pi-ai\n\n### Fixed\n\n- GitHub Copilot sign-in keeps the GitHub-owned Copilot CLI OAuth app on Enterprise domains: private instances run their own OAuth registry and reject the github.com-registered OpenCode client, which is now used only for public github.com sign-ins ([#11285](https://github.com/can1357/oh-my-pi/pull/11285) by [@H4vC](https://github.com/H4vC))\n- GitHub Copilot sign-in uses the minimal-grant OpenCode OAuth app again (`read:user` only): GitHub renders each app's existing per-user grant on the consent page, so Enterprise organizations that block the Copilot CLI app's broad historic grant can log in as on 18.1.4. API request identity still mimics the Copilot CLI, and tokens minted by either app keep working ([#11280](https://github.com/can1357/oh-my-pi/pull/11280) by [@H4vC](https://github.com/H4vC)).\n- GitHub Copilot plan/model-policy 403s no longer count as credential failures for credential-lifetime decisions: the token is valid, so stored credentials are preserved instead of wiped ([#11280](https://github.com/can1357/oh-my-pi/pull/11280) by [@H4vC](https://github.com/H4vC)).\n- Fixed custom `google-generative-ai` providers failing mid-turn model fallback when Gemini 3 tool calls are replayed without their original thought signature ([#11270](https://github.com/can1357/oh-my-pi/issues/11270)).\n\n## @oh-my-pi/pi-coding-agent\n\n### Added\n\n- Added `advisor.maxNotesPerUpdate` setting and `WATCHDOG.yml` configuration (default `4`): allows reasoning verifiers to batch findings in a single review update without being rate-limited.\n- Headless browser tabs now freeze when a turn settles so idle animated/WebGL pages stop burning CPU/GPU, resuming automatically on next use; tabs idle past `browser.idleCloseSec` (default 30 minutes) are closed. `persist: true` on `browser.open` opts a tab out of both ([#8246](https://github.com/can1357/oh-my-pi/issues/8246) by [@H4vC](https://github.com/H4vC)).\n\n### Changed\n\n- When enabled (`task.showResolvedModelBadge`), subagent model badges show the thinking-level icon, model name, and attached-advisor eye before the agent name in task, eval, job, and HUD rows.\n\n### Fixed\n\n- Task descriptions containing tabs no longer misalign or overflow task rows; tabs are expanded before measuring and rendering.\n- GitHub Copilot model-policy 403s (plan, model policy, org restriction) no longer delete stored credentials, so the provider stays listed in `/model` after a per-model access denial instead of disappearing until the next `/login` ([#11280](https://github.com/can1357/oh-my-pi/pull/11280) by [@H4vC](https://github.com/H4vC)).\n- Bash results no longer replace a failing command's output with the shell minimizer's lossy summary when the original capture cannot be persisted as an artifact; the raw diagnostics are kept so a failure stays actionable ([#11081](https://github.com/can1357/oh-my-pi/issues/11081)).\n- Fixed worker subprocesses failing to declare themselves as worker hosts before dispatching selectors, which prevented nested thread worker spawns during `/usage` stats sync on multi-core systems.\n- Fixed `/usage` displaying a misleading generic database read failure when activity loading fails; the error detail is now sanitized, collapsed to a single line with shortened paths, and surfaced in the dashboard.\n- Advisor notes now report rate limiting accurately, blockers always interrupt even after a lower-severity note in the same update, and deferred notes flush when the primary run completes, including after advisor quota exhaustion ([#11062](https://github.com/can1357/oh-my-pi/issues/11062)).\n- Fixed the built-in clangd registration omitting CUDA source and header files (`.cu` and `.cuh`) ([#10782](https://github.com/can1357/oh-my-pi/pull/10782) by [@alphastorm](https://github.com/alphastorm)).\n- Fixed `ast_grep` skipping CUDA headers and ignoring an explicit `lang` override for ambiguous file extensions ([#10782](https://github.com/can1357/oh-my-pi/pull/10782) by [@alphastorm](https://github.com/alphastorm)).\n- Python cells are no longer replayed automatically after a kernel crash, preventing duplicate side effects; the next call starts a fresh kernel.\n- Session rewrites preserve open-reader snapshots and replacement identity when a rename needs an EPERM fallback.\n- Fixed WorkPool children retaining a stale Gemini-formatted `yield` declaration when pooled items were installed or cleared.\n\n## @oh-my-pi/pi-natives\n\n### Fixed\n\n- Fixed C++ language inference excluding CUDA header (`.cuh`) files ([#10782](https://github.com/can1357/oh-my-pi/pull/10782) by [@alphastorm](https://github.com/alphastorm)).\n\n## @oh-my-pi/pi-tui\n\n### Fixed\n\n- Stopped long flicker when moving or resizing an omp pane in Warp. Resize repaints in place there after the drag settles (override with `PI_TUI_RESIZE_IN_PLACE=0`), with no alternate-screen borrow, no scrollback replay, blanked live rows so shrink drags cannot archive unfinished rows, and overlay toggle echoes repainting the modal instead of probing ([#11247](https://github.com/can1357/oh-my-pi/pull/11247) by [@H4vC](https://github.com/H4vC)).\n\n\n## What's Changed\n* fix(cli, usage): declare worker host entry before worker selector dispatch and surface activity error by @keethesh in https://github.com/can1357/oh-my-pi/pull/11201\n* feat(advisor): add configurable advice budget per update (default 4) by @korri123 in https://github.com/can1357/oh-my-pi/pull/11066\n* refactor: stop importing nixpkgs by @n3oney in https://github.com/can1357/oh-my-pi/pull/11170\n* fix(session): preserve replacement identity after rename denial by @iliaal in https://github.com/can1357/oh-my-pi/pull/11224\n* fix(eval): avoid replaying cells after kernel failure by @iliaal in https://github.com/can1357/oh-my-pi/pull/11225\n* feat(browser): freeze idle headless tabs at turn settle with idle-clo\u2026 by @H4vC in https://github.com/can1357/oh-my-pi/pull/11220\n* Fix/cuda cuh review nits by @H4vC in https://github.com/can1357/oh-my-pi/pull/11251\n* docs(notebook): point runtime links at the native edit implementation by @oleg494 in https://github.com/can1357/oh-my-pi/pull/11253\n* fix(bash): keep raw diagnostics when a minimized failure cannot be persisted by @oleg494 in https://github.com/can1357/oh-my-pi/pull/11259\n* fix(tui): skip resize alt-buffer borrow on Warp by @H4vC in https://github.com/can1357/oh-my-pi/pull/11247\n* fix(catalog): applied gemini wire policy to custom providers by @roboomp in https://github.com/can1357/oh-my-pi/pull/11274\n* fix(copilot): minimal-grant OAuth app and preserve creds on 403 by @H4vC in https://github.com/can1357/oh-my-pi/pull/11280\n* fix(coding-agent): match finalized tool args in ttsr by @roboomp in https://github.com/can1357/oh-my-pi/pull/10912\n* fix(copilot): keep official OAuth client for enterprise domains by @H4vC in https://github.com/can1357/oh-my-pi/pull/11285\n* feat(coding-agent): clarify subagent model badges by @Unravl in https://github.com/can1357/oh-my-pi/pull/11161\n* fix(coding-agent): expand tabs in task descriptions before render by @H4vC in https://github.com/can1357/oh-my-pi/pull/11292\n* fix(coding-agent): refresh WorkPool yield prompts by @alphastorm in https://github.com/can1357/oh-my-pi/pull/10784\n\n## New Contributors\n* @keethesh made their first contribution in https://github.com/can1357/oh-my-pi/pull/11201\n* @n3oney made their first contribution in https://github.com/can1357/oh-my-pi/pull/11170\n* @iliaal made their first contribution in https://github.com/can1357/oh-my-pi/pull/11224\n* @oleg494 made their first contribution in https://github.com/can1357/oh-my-pi/pull/11253\n\n**Full Changelog**: https://github.com/can1357/oh-my-pi/compare/v18.1.14...v18.1.15","reactions":{"total_count":7,"+1":5,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":2,"rocket":0,"eyes":0},"mentions_count":9}
